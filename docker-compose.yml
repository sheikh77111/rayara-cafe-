services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rayara
      POSTGRES_USER: rayara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rayara -d rayara"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    command: sh -c "python manage.py migrate --run-syncdb && python manage.py seed_demo && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    environment:
      DEBUG: ${DEBUG:-1}
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      DATABASE_URL: postgres://rayara:${POSTGRES_PASSWORD:-change-this-password}@db:5432/rayara
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
