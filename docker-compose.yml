services:
  db:
    image: postgres:16-alpine
    container_name: rayara_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rayara}
      POSTGRES_USER: ${POSTGRES_USER:-rayara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rayara_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rayara} -d ${POSTGRES_DB:-rayara}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rayara-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rayara_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEBUG: ${DEBUG:-1}
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      DATABASE_URL: postgres://${POSTGRES_USER:-rayara}:${POSTGRES_PASSWORD:-rayara_secure_pass_2026}@db:5432/${POSTGRES_DB:-rayara}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,frontend,host.docker.internal}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://frontend:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://127.0.0.1:8000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_media:/app/media
    networks:
      - rayara-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    container_name: rayara_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      BACKEND_API_URL: http://backend:8000/api
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - rayara-network

networks:
  rayara-network:
    driver: bridge

volumes:
  postgres_data:
  backend_media:
