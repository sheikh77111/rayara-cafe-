<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Staff & Owner Sign In | Rayara Cafe POS</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts for Luxury Typography -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --rayara-bronze: #2A1810;
      --rayara-bronze-dark: #1C100A;
      --rayara-amber: #E59A38;
      --rayara-amber-glow: #F5A623;
      --rayara-sand: #F5EFE6;
      --rayara-sand-card: #FAF6F0;
      --rayara-olive: #4E5D42;
    }
    body {
      background-color: var(--rayara-sand);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      background-image: 
        radial-gradient(#dfd2c0 0.75px, transparent 0.75px),
        radial-gradient(#e5d9c8 0.75px, var(--rayara-sand) 0.75px);
      background-size: 14px 14px;
      background-position: 0 0, 7px 7px;
    }
    .serif-brand {
      font-family: 'Cinzel', Georgia, serif;
    }
    .login-card {
      background: #ffffff;
      border: 1px solid #e2d5c3;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(42, 24, 16, 0.08), 0 0 25px rgba(229, 154, 56, 0.12);
      width: 100%;
      max-width: 440px;
      padding: 40px 32px;
    }
    .brand-emblem {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--rayara-bronze);
      border: 2px solid var(--rayara-amber);
      box-shadow: 0 0 25px rgba(229, 154, 56, 0.5);
      margin: 0 auto 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--rayara-amber-glow);
    }
    .btn-rayara {
      background-color: var(--rayara-bronze);
      color: #ffffff;
      font-weight: 600;
      border: 1px solid var(--rayara-amber);
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      box-shadow: 0 4px 16px rgba(42, 24, 16, 0.2);
      transition: all 0.2s ease;
    }
    .btn-rayara:hover {
      background-color: var(--rayara-bronze-dark);
      color: var(--rayara-amber-glow);
      box-shadow: 0 6px 22px rgba(229, 154, 56, 0.35);
    }
    .form-control {
      border: 1.5px solid #dcd1c2;
      border-radius: 14px;
      padding: 13px 16px;
      font-size: 15px;
      background-color: #faf7f2;
    }
    .form-control:focus {
      border-color: var(--rayara-amber);
      background-color: #ffffff;
      box-shadow: 0 0 0 4px rgba(229, 154, 56, 0.18);
    }
    .gold-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--rayara-amber), transparent);
      margin: 20px 0;
    }
  </style>
</head>
<body>

<div class="login-card">
  <!-- Brand Header -->
  <div class="text-center">
    <div class="brand-emblem">
      <div style="font-size: 22px; font-weight: bold; line-height: 1;">رايارة</div>
      <div style="font-size: 8px; letter-spacing: 2px; color: #fff;">RAYARA</div>
    </div>
    <h1 class="serif-brand h3 mb-1" style="color: var(--rayara-bronze); letter-spacing: 2px; font-weight: 700;">
      RAYARA CAFE
    </h1>
    <p class="text-muted small mb-0 tracking-wide">— RESTAURANT POS & MANAGEMENT —</p>
    <div class="gold-divider"></div>
  </div>

  <!-- Error Alerts -->
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} py-2 px-3 small rounded-3 mb-3">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}

  <!-- Login Form -->
  <form method="POST" action="{% url 'pos:login' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">

    <div class="mb-3">
      <label class="form-label small fw-semibold text-secondary">Username</label>
      <input type="text" name="username" class="form-control" placeholder="e.g. staff1 or admin" required autofocus autocomplete="username">
    </div>

    <div class="mb-4">
      <label class="form-label small fw-semibold text-secondary">Password</label>
      <input type="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
    </div>

    <button type="submit" class="btn btn-rayara w-100 mb-3">
      Sign In to POS
    </button>
  </form>

  <!-- Role Guidance Footer -->
  <div class="text-center pt-2 border-top">
    <p class="text-muted" style="font-size: 11px; margin-bottom: 4px;">
      <b>Staff</b>: Orders & Kitchen Printing (Tablet) · <b>Owner</b>: Menu, Pricing & Sales
    </p>
    <small class="text-secondary" style="font-size: 10px;">
      Demo Accounts: <code>staff1 / staff123</code> | <code>admin / admin123</code>
    </small>
  </div>
</div>

</body>
</html>
