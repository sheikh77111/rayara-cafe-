<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kitchen Display Screen Sign In | Rayara Cafe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --rayara-bronze: #2A1810;
      --rayara-bronze-dark: #1C100A;
      --rayara-amber: #E59A38;
      --rayara-amber-glow: #F5A623;
      --rayara-sand: #18191D;
      --rayara-card-dark: #22252B;
    }
    body {
      background-color: var(--rayara-sand);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 16px;
      color: #E2E8F0;
    }
    .serif-brand {
      font-family: 'Cinzel', Georgia, serif;
    }
    .login-card {
      background: var(--rayara-card-dark);
      border: 2px solid #333842;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 0 0 25px rgba(229, 154, 56, 0.15);
      width: 100%;
      max-width: 440px;
      padding: 36px 30px;
    }
    .kitchen-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #d97706, #ea580c);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 14px;
      box-shadow: 0 0 15px rgba(234, 88, 12, 0.4);
    }
    .brand-emblem {
      width: 64px;
      height: 64px;
      background: #121316;
      border-radius: 50%;
      border: 2px solid var(--rayara-amber);
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--rayara-amber-glow);
      margin-bottom: 14px;
      box-shadow: 0 0 20px rgba(229, 154, 56, 0.3);
    }
    .form-control {
      background-color: #17181C !important;
      border: 1.5px solid #333842 !important;
      color: #F8FAFC !important;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
    }
    .form-control:focus {
      border-color: var(--rayara-amber) !important;
      box-shadow: 0 0 0 4px rgba(229, 154, 56, 0.2) !important;
    }
    .btn-submit {
      background: linear-gradient(135deg, #E59A38, #d97706);
      color: #1C100A;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 15px;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(229, 154, 56, 0.35);
    }
    .btn-submit:hover {
      background: linear-gradient(135deg, #F5A623, #b45309);
      color: #000;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

<div class="login-card text-center">
  <div class="brand-emblem">
    <i class="bi bi-fire fs-3"></i>
  </div>

  <div>
    <span class="kitchen-badge"><i class="bi bi-display"></i> Kitchen Display System (KDS)</span>
  </div>

  <h1 class="serif-brand fw-bold mb-1" style="font-size: 24px; color: #FFFFFF;">RAYARA CAFÉ</h1>
  <p class="small text-secondary mb-4">Dedicated Kitchen Tablet / Smart Screen Portal</p>

  {% if messages %}
    {% for msg in messages %}
      <div class="alert alert-danger py-2 px-3 small rounded-3 mb-3 text-start">
        <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ msg }}
      </div>
    {% endfor %}
  {% endif %}

  <form method="POST" action="{% url 'pos:kitchen_login' %}" class="text-start">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next|default:'/pos/kitchen/' }}">

    <div class="mb-3">
      <label class="form-label small fw-semibold text-secondary mb-1">
        <i class="bi bi-person-fill text-warning me-1"></i> Kitchen Staff Username
      </label>
      <input type="text" name="username" class="form-control" placeholder="e.g. kitchen or staff1" value="kitchen" required autofocus>
    </div>

    <div class="mb-3">
      <label class="form-label small fw-semibold text-secondary mb-1">
        <i class="bi bi-key-fill text-warning me-1"></i> Kitchen Password
      </label>
      <input type="password" name="password" class="form-control" placeholder="Enter kitchen password" required>
    </div>

    <div class="bg-black bg-opacity-40 p-2.5 rounded-3 mb-3 border border-secondary border-opacity-25 text-center">
      <span class="text-secondary small">💡 Quick Kitchen Credentials:</span><br>
      <code class="text-warning fw-bold">kitchen</code> / <code class="text-warning fw-bold">kitchen123</code>
    </div>

    <button type="submit" class="btn btn-submit w-full d-block w-100">
      <i class="bi bi-box-arrow-in-right me-1"></i> Open Kitchen Screen
    </button>
  </form>

  <hr class="my-4 border-secondary border-opacity-25">

  <div class="d-flex justify-content-between text-secondary small">
    <a href="{% url 'pos:tablet' %}" class="text-warning text-decoration-none">
      <i class="bi bi-tablet me-1"></i> Staff Ordering
    </a>
    <a href="{% url 'pos:billing' %}" class="text-secondary text-decoration-none">
      <i class="bi bi-receipt me-1"></i> Billing Counter
    </a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
