<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Owner Administrator Login | Rayara Cafe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --rayara-bronze: #2A1810;
      --rayara-bronze-dark: #140B07;
      --rayara-amber: #E59A38;
      --rayara-amber-glow: #F5A623;
      --rayara-sand: #F5EFE6;
    }
    body {
      background-color: var(--rayara-bronze-dark);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 16px;
      background-image: 
        radial-gradient(rgba(229, 154, 56, 0.15) 1px, transparent 1px),
        radial-gradient(rgba(42, 24, 16, 0.8) 1px, var(--rayara-bronze-dark) 1px);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
    }
    .serif-brand {
      font-family: 'Cinzel', Georgia, serif;
    }
    .owner-card {
      background: #ffffff;
      border: 2px solid var(--rayara-amber);
      border-radius: 28px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4), 0 0 35px rgba(229, 154, 56, 0.35);
      width: 100%;
      max-width: 440px;
      padding: 40px 32px;
    }
    .owner-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #d97d26, #f5a623);
      color: #1c100a;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 16px;
      box-shadow: 0 0 15px rgba(245, 166, 35, 0.4);
    }
    .brand-emblem {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: var(--rayara-bronze);
      border: 2px solid var(--rayara-amber-glow);
      box-shadow: 0 0 25px rgba(229, 154, 56, 0.6);
      margin: 0 auto 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--rayara-amber-glow);
    }
    .btn-rayara-owner {
      background: linear-gradient(135deg, #3a2215, #1c100a);
      color: var(--rayara-amber-glow);
      font-weight: 700;
      border: 1.5px solid var(--rayara-amber);
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
    }
    .btn-rayara-owner:hover {
      background: #100804;
      color: #ffffff;
      box-shadow: 0 0 25px rgba(229, 154, 56, 0.5);
    }
    .form-control {
      border: 1.5px solid #dcd1c2;
      border-radius: 14px;
      padding: 13px 16px;
      font-size: 15px;
      background-color: #faf7f2;
    }
    .form-control:focus {
      border-color: var(--rayara-amber-glow);
      background-color: #ffffff;
      box-shadow: 0 0 0 4px rgba(229, 154, 56, 0.25);
    }
    .gold-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--rayara-amber), transparent);
      margin: 18px 0;
    }
    .portal-switch {
      font-size: 11px;
      color: #7a6a5d;
      text-align: center;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px dashed #e2d5c3;
    }
  </style>
</head>
<body>

<div class="owner-card">
  <div class="text-center">
    <div class="brand-emblem">
      <div style="font-size: 24px; font-weight: bold; line-height: 1;">رايارة</div>
      <div style="font-size: 9px; letter-spacing: 2px; color: #fff;">RAYARA</div>
    </div>
    <span class="owner-badge">
      <i class="bi bi-shield-shaded"></i> Executive Owner Portal
    </span>
    <h1 class="serif-brand h4 mb-1" style="color: var(--rayara-bronze); font-weight: 700;">
      RAYARA CAFE
    </h1>
    <p class="text-muted small mb-0">Sales Analytics, Menu Pricing & System Controls</p>
    <div class="gold-divider"></div>
  </div>

  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} py-2 px-3 small rounded-3 mb-3">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}

  <form method="POST" action="{% url 'pos:owner_login' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">

    <div class="mb-3">
      <label class="form-label small fw-semibold text-secondary">Owner Username</label>
      <div class="input-group">
        <span class="input-group-text bg-light border-end-0" style="border-radius: 14px 0 0 14px; border-color: #dcd1c2;">
          <i class="bi bi-person-badge-fill text-muted"></i>
        </span>
        <input type="text" name="username" class="form-control border-start-0" placeholder="e.g. admin" required autofocus style="border-radius: 0 14px 14px 0;">
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label small fw-semibold text-secondary">Master Password</label>
      <div class="input-group">
        <span class="input-group-text bg-light border-end-0" style="border-radius: 14px 0 0 14px; border-color: #dcd1c2;">
          <i class="bi bi-lock-fill text-muted"></i>
        </span>
        <input type="password" name="password" class="form-control border-start-0" placeholder="••••••••" required style="border-radius: 0 14px 14px 0;">
      </div>
    </div>

    <button type="submit" class="btn btn-rayara-owner w-100">
      <i class="bi bi-shield-check me-1"></i> Sign In to Owner Management
    </button>
  </form>

  <div class="portal-switch">
    <p class="mb-1">
      <i class="bi bi-tablet me-1"></i> Are you a waiter or cashier?
    </p>
    <a href="{% url 'pos:staff_login' %}" class="fw-bold text-decoration-none" style="color: var(--rayara-bronze);">
      Go to Staff & Cashier Ordering Portal →
    </a>
  </div>
</div>

</body>
</html>
